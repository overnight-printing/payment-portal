name = "payment-portal-worker"
main = "src/index.js"
compatibility_date = "2026-10-12"

# Environment Variables & Secrets required (to be added via Wrangler CLI or Cloudflare Dashboard):
# - APP_ENV (development or production)
# - PUBLIC_ORIGIN
# - STAFF_PASSCODE (minimum 12 characters)
# - SESSION_SECRET (minimum 32 random characters)
# - CARDPOINTE_USER
# - CARDPOINTE_PASS
# - CARDPOINTE_MID
# - SUPABASE_URL
# - SUPABASE_SERVICE_ROLE_KEY
# - RESEND_API_KEY

[ai]
binding = "AI"
